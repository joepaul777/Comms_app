name = "comms-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
PROJECT_ID = "jp-comms"
# Your Metered dashboard address, e.g. "yourname.metered.live"
METERED_DOMAIN = "joepaul.metered.live"

# The newest Comms release. Raise LATEST_BUILD (it must match the "+number" in
# pubspec.yaml) and redeploy, and every phone on an older build is offered the update.
LATEST_VERSION = "2.2.3"
LATEST_BUILD = "5009"
DOWNLOAD_URL = "https://joepaul.vercel.app/downloads/Comms.apk"
RELEASE_NOTES = "Choose where call sound plays: tap the sound button during a voice or video call to switch between the phone (in-ear), the speaker, headphones and Bluetooth. Calls use your headphones automatically when they are connected."
