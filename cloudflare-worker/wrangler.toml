name = "comms-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
PROJECT_ID = "jp-comms"
# Your Metered dashboard address, e.g. "yourname.metered.live"
METERED_DOMAIN = "joepaul.metered.live"

# The newest Comms release. Raise LATEST_BUILD (it must match the "+number" in
# pubspec.yaml) and redeploy, and every phone on an older build is offered the update.
LATEST_VERSION = "2.2.4"
LATEST_BUILD = "5010"
DOWNLOAD_URL = "https://joepaul.vercel.app/downloads/Comms.apk"
RELEASE_NOTES = "Better video calls: a phone held upright now shows in full on a computer instead of zoomed in, your own picture snaps to a corner when you drag it, and turning your camera off shows your photo instead of a black screen. Bluetooth earbuds also go back to normal as soon as a call ends."
