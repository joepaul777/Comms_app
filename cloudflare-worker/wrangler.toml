name = "comms-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
PROJECT_ID = "jp-comms"
# Your Metered dashboard address, e.g. "yourname.metered.live"
METERED_DOMAIN = "joepaul.metered.live"

# The newest Comms release. Raise LATEST_BUILD (it must match the "+number" in
# pubspec.yaml) and redeploy, and every phone on an older build is offered the update.
LATEST_VERSION = "2.2.2"
LATEST_BUILD = "5008"
DOWNLOAD_URL = "https://joepaul.vercel.app/downloads/Comms.apk"
RELEASE_NOTES = "Calls are fixed between phones and Comms Web: if you are signed in on both, answering or declining on one now stops the other, and calls connect even without a camera. Profile photos and your video preview no longer have a yellow edge."
