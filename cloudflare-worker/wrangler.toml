name = "comms-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
PROJECT_ID = "jp-comms"
# Your Metered dashboard address, e.g. "yourname.metered.live"
METERED_DOMAIN = "joepaul.metered.live"

# The newest Comms release. Raise LATEST_BUILD (it must match the "+number" in
# pubspec.yaml) and redeploy, and every phone on an older build is offered the update.
LATEST_VERSION = "2.2.5"
LATEST_BUILD = "5011"
DOWNLOAD_URL = "https://joepaul.vercel.app/downloads/Comms.apk"
RELEASE_NOTES = "Clearer calls: voices now sound fuller and hold up better on weak connections, with noise reduction that really works on Android. New call settings button (top left during a call) to switch microphone, sound output and noise reduction mid-call."
