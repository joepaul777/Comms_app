name = "comms-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
PROJECT_ID = "jp-comms"
# Your Metered dashboard address, e.g. "yourname.metered.live"
METERED_DOMAIN = "joepaul.metered.live"
# Identifies Comms to browsers' push services (Comms Web notifications). Public by
# design; the matching private key is the VAPID_PRIVATE_KEY secret.
VAPID_PUBLIC_KEY = "BFFlmdibS8j3gKojzELdBKQ3nWIwNyaE9ALd57rVqp55hBPTGKmARlfEBwPJB7ICwYXfr1sEL0OL2sKGEYtYGHY"

# The newest Comms release. Raise LATEST_BUILD (it must match the "+number" in
# pubspec.yaml) and redeploy, and every phone on an older build is offered the update.
LATEST_VERSION = "2.2.6"
LATEST_BUILD = "5012"
DOWNLOAD_URL = "https://joepaul.vercel.app/downloads/Comms.apk"
RELEASE_NOTES = "Video calls can now keep going in a small floating window: go home or press back during a video call. The window is shaped like the other person's screen. Also new: Comms on iPhone (add jp-comms.web.app to the Home Screen), with notifications even when Comms is closed."
