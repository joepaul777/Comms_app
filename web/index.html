<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Comms on the web: your chats, voice notes, photos and calls, end-to-end encrypted.">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Comms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Comms</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0A; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: opacity .3s ease;
    }
    #splash div {
      width: 84px; height: 84px; border-radius: 26px; background: #FACC15; color: #0A0A0A;
      display: flex; align-items: center; justify-content: center;
      font: 900 28px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -1px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .8; } }
  </style>
</head>
<body>
  <div id="splash"><div>CO.</div></div>
  <script>
    // Hide the loading mark once the app has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
